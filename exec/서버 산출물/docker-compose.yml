name: unblur-dev

services:
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.50"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ../frontend:/usr/share/nginx/html:ro
    depends_on:
      - grafana
    environment:
      TZ: Asia/Seoul
    networks:
      - webrtc-net

  kurento:
    image: kurento/kurento-media-server:7.0.1
    restart: unless-stopped
    mem_limit: 2500m
    cpus: "2.00"
    ports:
      - "26000-26999:26000-26999/udp"

    volumes:
      - recordings_data:/recordings
    environment:
      KMS_MIN_PORT: "${KMS_MIN_PORT}"
      KMS_MAX_PORT: "${KMS_MAX_PORT}"
      KMS_TURN_URL: "${KMS_TURN_URL}"
      TZ: Asia/Seoul
    networks:
      - webrtc-net

  coturn:
    image: coturn/coturn:4.6.2
    container_name: unblur-dev-coturn
    restart: unless-stopped
    network_mode: host
    init: true
    stop_grace_period: 5s
    mem_limit: 512m
    cpus: "0.50"
    env_file:
      - .env
    entrypoint: ["turnserver"]
    command:
      - -n
      - --log-file=stdout
      - --realm=${TURN_REALM}
      - --lt-cred-mech
      - --user=${TURN_USER}:${TURN_PASSWORD}
      - --listening-ip=${TURN_PRIVATE_IP}
      - --relay-ip=${TURN_PRIVATE_IP}
      - --listening-port=${TURN_LISTEN_PORT}
      - --external-ip=${TURN_PUBLIC_IP}/${TURN_PRIVATE_IP}
      - --min-port=${TURN_MIN_PORT}
      - --max-port=${TURN_MAX_PORT}
      - --no-cli
      - --fingerprint
      - --no-tls
      - --no-dtls
    environment:
      TZ: Asia/Seoul


  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    mem_limit: 2g
    cpus: "1.50"
    ports:
      - "8543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pgvector-init.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    environment:
      POSTGRES_USER: A705
      POSTGRES_PASSWORD: "wQ9pX3!Zt7b#V2mN4sC8"
      POSTGRES_DB: unblur
      TZ: Asia/Seoul
    networks:
      - webrtc-net

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.00"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
      MINIO_BROWSER_REDIRECT_URL: "https://i14a705.p.ssafy.io/minio/"
      MINIO_NOTIFY_WEBHOOK_ENABLE_1: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_1: "http://be:8080/api/internal/minio/events"
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_1: "${INTERNAL_API_TOKEN}"
      TZ: Asia/Seoul
    networks:
      - webrtc-net

  minio-init:
    image: minio/mc:latest
    mem_limit: 128m
    cpus: "0.25"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio123; do sleep 2; done;
      mc mb --ignore-existing local/unblur-recordings;
      "
    environment:
      TZ: Asia/Seoul
    networks:
      - webrtc-net
  prometheus:
    image: prom/prometheus:v2.49.1
    restart: unless-stopped
    mem_limit: 768m
    cpus: "0.75"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    environment:
      TZ: Asia/Seoul
    networks:
      - webrtc-net

  loki:
    image: grafana/loki:2.9.3
    restart: unless-stopped
    mem_limit: 768m
    cpus: "0.75"
    command:
      - "-config.file=/etc/loki/loki.yml"
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    environment:
      TZ: Asia/Seoul
    networks:
      - webrtc-net

  promtail:
    image: grafana/promtail:3.0.0
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.25"
    command:
      - "-config.file=/etc/promtail/promtail.yml"
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TZ: Asia/Seoul
    networks:
      - webrtc-net

  grafana:
    image: grafana/grafana:10.4.1
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.50"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SERVER_ROOT_URL: "https://i14a705.p.ssafy.io/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_DOMAIN: "i14a705.p.ssafy.io"
      GF_SECURITY_ADMIN_USER: A705
      GF_SECURITY_ADMIN_PASSWORD: "wQ9pX3!Zt7b#V2mN4sC8"
      TZ: Asia/Seoul
    networks:
      - webrtc-net

  be:
    image: ${BE_IMAGE}:latest
    restart: unless-stopped
    mem_limit: 1536m
    cpus: "1.50"
    env_file:
      - .env
    depends_on:
      - postgres

    volumes:
      - recordings_data:/recordings
      - /opt/unblur/logs:/logs
    environment:
      TZ: Asia/Seoul
    networks:
      - webrtc-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s


  fe:
    image: ${FE_IMAGE}:latest
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.50"
    environment:
      NODE_ENV: production
      TZ: Asia/Seoul
    networks:
      - webrtc-net


  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    command:
      - "--nginx.scrape-uri=http://nginx/nginx_status"
    environment:
      TZ: Asia/Seoul
    networks:
      - webrtc-net
    depends_on:
      - nginx

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    env_file:
      - .env
    environment:
      DATA_SOURCE_URI: "${POSTGRES_HOST}:5432/${POSTGRES_DB}?sslmode=disable"
      DATA_SOURCE_USER: "${POSTGRES_USER}"
      DATA_SOURCE_PASS: "${POSTGRES_PASSWORD}"
      TZ: Asia/Seoul
    networks:
      - webrtc-net
    depends_on:
      - postgres

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.25"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    environment:
      TZ: Asia/Seoul
    networks:
      - webrtc-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.50"
    ports:
      - "8089:8080"
    command:
      - --docker_only=true
      - --store_container_labels=true
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project,com.docker.compose.container-number
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    environment:
      TZ: Asia/Seoul
    networks:
      - webrtc-net
networks:
  webrtc-net:
    driver: bridge

volumes:
  recordings_data:
  postgres_data:
  minio_data:
  prometheus_data:
  loki_data:
  grafana_data:
