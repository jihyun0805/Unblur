services:
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minio1234}; do sleep 2; done;
      mc mb --ignore-existing local/unblur-recordings;
      "
    networks:
      - unblur-net

networks:
  unblur-net:
    driver: bridge
