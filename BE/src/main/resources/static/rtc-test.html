<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurento WebRTC Test</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #00d9ff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .controls {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .control-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .control-row label {
            min-width: 100px;
            color: #888;
        }
        input {
            padding: 10px 15px;
            border: 1px solid #333;
            border-radius: 5px;
            background: #0f0f23;
            color: #fff;
            font-size: 14px;
            flex: 1;
            min-width: 200px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-primary {
            background: #00d9ff;
            color: #000;
        }
        .btn-success {
            background: #00ff88;
            color: #000;
        }
        .btn-danger {
            background: #ff4757;
            color: #fff;
        }
        .btn-secondary {
            background: #555;
            color: #fff;
        }
        .video-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .video-box {
            background: #0f0f23;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .video-box h3 {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 10;
        }
        video {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background: #000;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #0f0f23;
            border-radius: 5px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4757;
        }
        .status-dot.connected {
            background: #00ff88;
        }
        .log-container {
            background: #0f0f23;
            border-radius: 10px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-container h3 {
            margin-bottom: 10px;
            color: #00d9ff;
        }
        .log-entry {
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 12px;
            padding: 5px 0;
            border-bottom: 1px solid #222;
        }
        .log-entry.send {
            color: #00d9ff;
        }
        .log-entry.receive {
            color: #00ff88;
        }
        .log-entry.error {
            color: #ff4757;
        }
        .log-entry .time {
            color: #666;
            margin-right: 10px;
        }
        @media (max-width: 768px) {
            .video-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kurento WebRTC Test</h1>

        <div class="controls">
            <div class="control-row">
                <label>WebSocket URL:</label>
                <input type="text" id="wsUrl">
            </div>
            <div class="control-row">
                <label>User ID:</label>
                <input type="text" id="userId" placeholder="자동 생성됨">
                <button class="btn-secondary" onclick="generateUserId()">생성</button>
            </div>
            <div class="control-row">
                <label>Conference ID:</label>
                <input type="text" id="conferenceId" placeholder="방 ID 입력">
                <button class="btn-secondary" onclick="generateConferenceId()">생성</button>
            </div>
            <div class="control-row">
                <button id="btnConnect" class="btn-primary" onclick="connect()">1. WebSocket 연결</button>
                <button id="btnRegister" class="btn-primary" onclick="register()" disabled>2. 등록</button>
                <button id="btnJoin" class="btn-success" onclick="joinRoom()" disabled>3. 방 입장</button>
                <button id="btnLeave" class="btn-danger" onclick="leaveRoom()" disabled>퇴장</button>
                <button id="btnDisconnect" class="btn-danger" onclick="disconnect()" disabled>연결 끊기</button>
            </div>
            <div class="control-row">
                <div class="status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">연결 안됨</span>
                </div>
            </div>
        </div>

        <div class="video-container">
            <div class="video-box">
                <h3>Local Video</h3>
                <video id="localVideo" autoplay muted playsinline></video>
            </div>
            <div class="video-box">
                <h3>Remote Video</h3>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
        </div>

        <div class="log-container">
            <h3>Log</h3>
            <div id="log"></div>
        </div>
    </div>

    <script>
        let ws = null;
        let pc = null;
        let localStream = null;
        let userId = null;
        let conferenceId = null;
        let iceCandidateQueue = [];

        // UUID 생성
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function generateUserId() {
            document.getElementById('userId').value = generateUUID();
        }

        function generateConferenceId() {
            document.getElementById('conferenceId').value = generateUUID();
        }

        // 로그 출력
        function log(type, message) {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="time">[${time}]</span> ${message}`;
            logDiv.insertBefore(entry, logDiv.firstChild);
        }

        // 상태 업데이트
        function updateStatus(connected, text) {
            const dot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            dot.className = connected ? 'status-dot connected' : 'status-dot';
            statusText.textContent = text;
        }

        // WebSocket 연결
        function connect() {
            const wsUrl = document.getElementById('wsUrl').value;
            log('send', `WebSocket 연결 시도: ${wsUrl}`);

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                log('receive', 'WebSocket 연결됨');
                updateStatus(true, 'WebSocket 연결됨');
                document.getElementById('btnConnect').disabled = true;
                document.getElementById('btnRegister').disabled = false;
                document.getElementById('btnDisconnect').disabled = false;
            };

            ws.onclose = () => {
                log('error', 'WebSocket 연결 종료');
                updateStatus(false, '연결 안됨');
                resetButtons();
            };

            ws.onerror = (error) => {
                log('error', `WebSocket 오류: ${error}`);
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                log('receive', `수신: ${JSON.stringify(message)}`);
                handleMessage(message);
            };
        }

        // 메시지 전송
        function sendMessage(message) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                log('send', `송신: ${JSON.stringify(message)}`);
                ws.send(JSON.stringify(message));
            }
        }

        // 메시지 처리
        function handleMessage(message) {
            switch (message.type) {
                case 'registered':
                    log('receive', `등록 완료: userId=${message.userId}`);
                    document.getElementById('btnJoin').disabled = false;
                    break;

                case 'joined':
                    log('receive', `방 입장 완료: conferenceId=${message.conferenceId}`);
                    document.getElementById('btnLeave').disabled = false;
                    startCall();
                    break;

                case 'answer':
                    handleAnswer(message.sdpAnswer);
                    break;

                case 'candidate':
                    handleRemoteCandidate(message.candidate);
                    break;

                case 'left':
                    log('receive', `퇴장 완료: userId=${message.userId}`);
                    break;

                case 'error':
                    log('error', `에러: ${message.message}`);
                    break;
            }
        }

        // 등록
        function register() {
            userId = document.getElementById('userId').value || generateUUID();
            document.getElementById('userId').value = userId;

            sendMessage({
                type: 'register',
                userId: userId
            });
        }

        // 방 입장
        async function joinRoom() {
            conferenceId = document.getElementById('conferenceId').value;
            if (!conferenceId) {
                log('error', 'Conference ID를 입력해주세요');
                return;
            }

            // 미디어 스트림 가져오기
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });
                document.getElementById('localVideo').srcObject = localStream;
                log('receive', '로컬 미디어 스트림 획득 성공');
            } catch (error) {
                log('error', `미디어 스트림 획득 실패: ${error.message}`);
                return;
            }

            sendMessage({
                type: 'join',
                conferenceId: conferenceId,
                userId: userId
            });
        }

        // WebRTC 통화 시작
        async function startCall() {
            // RTCPeerConnection 생성
            pc = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' }
                ]
            });

            // 로컬 스트림 추가
            localStream.getTracks().forEach(track => {
                pc.addTrack(track, localStream);
            });

            // 원격 스트림 처리
            pc.ontrack = (event) => {
                log('receive', '원격 스트림 수신');
                document.getElementById('remoteVideo').srcObject = event.streams[0];
            };

            // ICE Candidate 처리
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    sendMessage({
                        type: 'candidate',
                        conferenceId: conferenceId,
                        userId: userId,
                        candidate: {
                            candidate: event.candidate.candidate,
                            sdpMid: event.candidate.sdpMid,
                            sdpMLineIndex: event.candidate.sdpMLineIndex
                        }
                    });
                }
            };

            pc.oniceconnectionstatechange = () => {
                log('receive', `ICE 연결 상태: ${pc.iceConnectionState}`);
                if (pc.iceConnectionState === 'connected') {
                    updateStatus(true, 'WebRTC 연결됨');
                }
            };

            // Offer 생성 및 전송
            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                sendMessage({
                    type: 'offer',
                    conferenceId: conferenceId,
                    userId: userId,
                    sdpOffer: offer.sdp
                });
            } catch (error) {
                log('error', `Offer 생성 실패: ${error.message}`);
            }
        }

        // Answer 처리
        async function handleAnswer(sdpAnswer) {
            try {
                await pc.setRemoteDescription(new RTCSessionDescription({
                    type: 'answer',
                    sdp: sdpAnswer
                }));
                log('receive', 'Remote description 설정 완료');

                // 큐에 있던 ICE candidate 처리
                while (iceCandidateQueue.length > 0) {
                    const candidate = iceCandidateQueue.shift();
                    await pc.addIceCandidate(candidate);
                }
            } catch (error) {
                log('error', `Answer 처리 실패: ${error.message}`);
            }
        }

        // 원격 ICE Candidate 처리
        async function handleRemoteCandidate(candidate) {
            try {
                const iceCandidate = new RTCIceCandidate({
                    candidate: candidate.candidate,
                    sdpMid: candidate.sdpMid,
                    sdpMLineIndex: candidate.sdpMLineIndex
                });

                if (pc && pc.remoteDescription) {
                    await pc.addIceCandidate(iceCandidate);
                } else {
                    iceCandidateQueue.push(iceCandidate);
                }
            } catch (error) {
                log('error', `ICE Candidate 추가 실패: ${error.message}`);
            }
        }

        // 방 퇴장
        function leaveRoom() {
            sendMessage({
                type: 'leave',
                conferenceId: conferenceId,
                userId: userId
            });

            cleanup();
        }

        // 연결 끊기
        function disconnect() {
            if (ws) {
                ws.close();
            }
            cleanup();
        }

        // 정리
        function cleanup() {
            if (pc) {
                pc.close();
                pc = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            iceCandidateQueue = [];
        }

        // 버튼 상태 초기화
        function resetButtons() {
            document.getElementById('btnConnect').disabled = false;
            document.getElementById('btnRegister').disabled = true;
            document.getElementById('btnJoin').disabled = true;
            document.getElementById('btnLeave').disabled = true;
            document.getElementById('btnDisconnect').disabled = true;
        }

        // 페이지 로드 시 초기화
        window.onload = () => {
            generateUserId();

            // 현재 호스트 기반으로 WebSocket URL 자동 설정
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            document.getElementById('wsUrl').value = `${protocol}//${host}/ws/rtc`;
        };
    </script>
</body>
</html>
