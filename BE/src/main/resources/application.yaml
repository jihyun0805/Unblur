spring:
  profiles:
    default: local
  application:
    name: unblur
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:unblur}
    username: ${POSTGRES_USER:unblur}
    password: ${POSTGRES_PASSWORD:unblur}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
