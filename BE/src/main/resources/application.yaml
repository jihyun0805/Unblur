spring:
  profiles:
    default: local
  application:
    name: unblur
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:unblur}
    username: ${POSTGRES_USER:unblur}
    password: ${POSTGRES_PASSWORD:unblur}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  forward-headers-strategy: framework

kurento:
  ws:
    uri: ${KURENTO_WS_URI:ws://localhost:8888/kurento}

rtc:
  websocket:
    url: ${RTC_WS_URL:ws://localhost:8080/ws/rtc}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

jwt:
  secret: ${JWT_SECRET}

auth:
  email:
    verification:
      expire-minutes: ${EMAIL_VERIFICATION_EXPIRE_MINUTES:10}

internal:
  api:
    token: ${INTERNAL_API_TOKEN}

openai:
  api-key: ${GMS_KEY}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minio}
  secret-key: ${MINIO_ROOT_PASSWORD:minio123}
  bucket: ${MINIO_BUCKET:unblur-recordings}


