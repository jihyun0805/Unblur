spring:
  profiles:
    default: local
  application:
    name: unblur
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:unblur}
    username: ${POSTGRES_USER:unblur}
    password: ${POSTGRES_PASSWORD:unblur}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate

server:
  forward-headers-strategy: framework

kurento:
  ws:
    uri: ws://localhost:8888/kurento

rtc:
  websocket:
    url: ws://localhost:8080/ws/rtc

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

jwt:
  secret: ${JWT_SECRET}

internal:
  api:
    token: ${INTERNAL_API_TOKEN}

openai:
  api-key: ${GMS_KEY}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minio}
  secret-key: ${MINIO_ROOT_PASSWORD:minio123}
  bucket: ${MINIO_BUCKET:unblur-recordings}
