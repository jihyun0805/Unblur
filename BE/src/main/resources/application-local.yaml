spring:
  config:
    import: optional:file:.env[.properties]
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true

server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:ssl/localhost.p12
    key-store-type: PKCS12
    key-store-password: changeit

local:
  http:
    enabled: true

jwt:
  secret: ${JWT_SECRET}